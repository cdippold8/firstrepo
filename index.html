<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Interval Run</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <section class="screen active" id="screen-setup">
    <header class="screen-header">
      <h1>Interval Run</h1>
      <p class="subtitle">Build your run, then hit start.</p>
    </header>

    <main class="setup-body">

      <div class="card">
        <h2 class="card-title">Warm up &amp; cool down</h2>
        <div class="field-row">
          <label class="field">
            <span>Warm up (min)</span>
            <input type="number" id="warmupMin" min="0" step="1" inputmode="numeric" value="5" />
          </label>
          <label class="field">
            <span>Cool down (min)</span>
            <input type="number" id="cooldownMin" min="0" step="1" inputmode="numeric" value="5" />
          </label>
        </div>
      </div>

      <div class="card">
        <div class="card-title-row">
          <h2 class="card-title">Intervals</h2>
          <button type="button" class="ghost-btn small" id="addBlockBtn">+ Add interval</button>
        </div>
        <p class="muted small-text">Each interval repeats: every X min, work for X min.</p>
        <div id="blocksList" class="blocks-list"></div>
      </div>

      <div class="card summary-card">
        <h2 class="card-title">Summary</h2>
        <div id="summaryBody" class="summary-body"></div>
      </div>

    </main>

    <footer class="setup-footer">
      <button type="button" class="primary-btn" id="startBtn">Start Run</button>
    </footer>
  </section>

  <!-- RUNNING / TIME TRACKING SCREEN -->
  <section class="screen" id="screen-run">
    <div class="run-top">
      <button type="button" class="icon-btn" id="stopBtn" aria-label="Stop run">✕</button>
      <div class="run-progress-track">
        <div class="run-progress-fill" id="overallProgressFill"></div>
      </div>
      <div class="run-elapsed" id="elapsedTime">0:00</div>
    </div>

    <main class="run-body">
      <div class="phase-pill" id="phasePill">Warm Up</div>
      <div class="run-clock" id="runClock">00:00</div>
      <div class="run-meta" id="runMeta"></div>
      <div class="next-up" id="nextUp"></div>
    </main>

    <footer class="run-controls">
      <button type="button" class="control-btn" id="skipBtn">Skip ▶</button>
      <button type="button" class="control-btn primary" id="pauseBtn">Pause</button>
    </footer>
  </section>

  <!-- DONE SCREEN -->
  <section class="screen" id="screen-done">
    <main class="done-body">
      <div class="done-check">✓</div>
      <h1>Run complete</h1>
      <p class="subtitle" id="doneSubtitle"></p>

      <div class="card done-stats" id="doneStats"></div>
    </main>

    <footer class="setup-footer">
      <button type="button" class="primary-btn" id="newRunBtn">Start Another Run</button>
    </footer>
  </section>

</div>

<script src="js/app.js"></script>
</body>
</html>
